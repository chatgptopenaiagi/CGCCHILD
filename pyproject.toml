[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgcchild"
version = "0.3.0"
description = "CREDID GUARDIAN CODEX experimental Windows continuity workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Mihai-Bogdan Simion"}]

[project.optional-dependencies]
gui = ["PySide6==6.11.2"]

[project.scripts]
cgcchild = "cgcchild.cli:main"

[project.gui-scripts]
cgcchild-gui = "cgcchild.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cgcchild = ["resources/*.json", "resources/*.md"]
